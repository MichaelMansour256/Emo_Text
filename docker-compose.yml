# Local stack: web on http://localhost:3000, API on http://localhost:8000 (docs at /docs),
# one render worker, Redis, Postgres.
#   docker compose up --build
# Put OPENAI_API_KEY / ANTHROPIC_API_KEY in a .env file next to this one for the OpenAI voices
# and the Claude Director. Auth runs in dev mode here: never expose this stack publicly as is.

x-backend: &backend
  build: ./backend
  environment:
    EMOTEXT_REDIS_URL: redis://redis:6379/0
    EMOTEXT_DATABASE_URL: postgresql+psycopg://emotext:emotext@db:5432/emotext
    EMOTEXT_SECRET_KEY: ${EMOTEXT_SECRET_KEY:-dev-insecure-change-me}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    EMOTEXT_TTS_PROVIDER: ${EMOTEXT_TTS_PROVIDER:-gtts}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  volumes:
    - data:/data
  depends_on:
    redis:
      condition: service_healthy
    db:
      condition: service_healthy

services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: ["celery", "-A", "emotext.worker", "worker", "--loglevel=info", "--concurrency=2"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: emotext
      POSTGRES_PASSWORD: emotext
      POSTGRES_DB: emotext
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "emotext"]
      interval: 5s
      retries: 10

volumes:
  data:
  pgdata:
