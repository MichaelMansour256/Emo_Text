# For the alembic CLI (run from backend/): alembic revision --autogenerate -m "..."
# The app itself migrates on startup; the URL comes from EMOTEXT_DATABASE_URL.
[alembic]
script_location = emotext/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
