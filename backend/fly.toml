# Fly.io: the API and the render worker from one image. See ../DEPLOY.md.
#   fly launch --no-deploy --copy-config   (once, then set secrets)
#   fly deploy
app = "emotext-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  EMOTEXT_ENVIRONMENT = "production"
  EMOTEXT_AUTH_MODE = "jwt"
  EMOTEXT_STORAGE_BACKEND = "s3"
  EMOTEXT_DATA_DIR = "/data"
  EMOTEXT_TTS_PROVIDER = "openai"
  EMOTEXT_DIRECTOR = "heuristic"

[deploy]
  # Migrations run once per release, before new machines start.
  release_command = "emotext db upgrade"

[processes]
  api = "uvicorn emotext.api:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
  worker = "celery -A emotext.worker worker --loglevel=info --concurrency=2"

[http_service]
  internal_port = 8000
  processes = ["api"]
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/ready"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  processes = ["api"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "2gb"
