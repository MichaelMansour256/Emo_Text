[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotext"
version = "0.1.0"
description = "Emotion-aware AI audiobook generation service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
    "celery>=5.3",
    "redis>=5.0",
    "pymupdf>=1.24",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "anthropic>=2.10",
]

[project.optional-dependencies]
gtts = ["gTTS>=2.5"]
dev = ["pytest>=8", "ruff>=0.5", "gTTS>=2.5"]

[project.scripts]
emotext = "emotext.cli:main"

[tool.setuptools.packages.find]
include = ["emotext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs the ffmpeg binary on PATH"]

[tool.ruff]
line-length = 100
target-version = "py310"
